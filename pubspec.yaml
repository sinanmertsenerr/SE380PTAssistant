name: ptassistant
description: "PTAssistant — AI-powered personal training assistant."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: any

  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  go_router: ^14.6.2

  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0
  firebase_app_check: ^0.4.3
  firebase_ai: ^3.11.0

  google_sign_in: ^7.2.0

  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  image_picker: ^1.1.2
  image_cropper: ^9.0.0

  fl_chart: ^1.0.0
  flutter_markdown: ^0.7.4+1

  shared_preferences: ^2.3.3

  collection: ^1.19.0
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  very_good_analysis: ^10.0.0

  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^3.0.0

  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.1.0
  firebase_auth_mocks: ^0.15.0

flutter:
  uses-material-design: true
  generate: true
